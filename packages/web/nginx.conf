server {
  listen 80;
  root /usr/share/nginx/html;

  # The names of the files under /assets carry a hash of their content.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # A new build must reach the browser at the next load, so the page itself
  # is never held. Every path answers the page: the router lives in it.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
