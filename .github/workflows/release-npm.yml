name: Release npm

# `@git8n/cli` goes to npm from the tag of a release (DB-688), with a provenance attestation that
# ties the tarball to the commit and the run that built it.
#
# A release published on GitHub starts this workflow. A tag pushed alone starts nothing: a person
# creates the release and its tag `vx.y.z` in one step, in the interface of GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only for every job. Only `publish` asks for more, and only for an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks of ci.yml on the tagged commit.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No cache: what this job builds goes to npm, and any run of this repository can write a cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # npm keeps a number that was published one time for ever. A tag that names another version
      # than the package would publish a number that nobody chose.
      - name: The tag and the package name the same version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::The tag is $TAG and packages/cli/package.json says $declared."
            exit 1
          fi

      # pnpm, not npm: it writes the versions of `catalog:` into the tarball. `prepack` builds it.
      - name: Pack the package
        run: pnpm --filter @git8n/cli pack --pack-destination "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Sends the tarball of `package` to npm. The environment `npm` gives the job its OIDC token only
  # after a person approves the run.
  # WARNING: only a published release publishes. A run by hand only packs and checks (`--dry-run`),
  # also on a tag. To run a failed release again, use « Re-run jobs » of its run.
  publish:
    name: publish to npm
    needs: [ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: npm trusts the OIDC token of this run, so no npm token exists.
      # The same token signs the provenance.
      id-token: write
    steps:
      # No checkout and no install: this job publishes the tarball that `package` built.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: tarballs

      - name: The npm of the runner can publish with OIDC
        run: |
          set -euo pipefail
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::Trusted publishing needs npm 11.5.1 or later, and npm is $(npm --version)."; exit 1; }

      # WARNING: npm accepts the OIDC token of this run only because the trusted publisher of
      # @git8n/cli is `release-npm.yml` of this repository, in the environment `npm`.
      # See CONTRIBUTING.md.
      - name: Publish the tarball
        env:
          FROM_A_RELEASE: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # `./` first: else npm reads `tarballs/x.tgz` as the GitHub repository `tarballs/x.tgz`.
          tarball=$(find ./tarballs -maxdepth 1 -name 'git8n-cli-[0-9]*.tgz' | head -n 1)
          if [ -z "$tarball" ]; then
            echo "::error::No tarball of @git8n/cli."
            exit 1
          fi
          version=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$FROM_A_RELEASE" != true ]; then
            npm publish "$tarball" --access public --dry-run
          elif npm view "@git8n/cli@$version" version >/dev/null 2>&1; then
            echo "@git8n/cli@$version is already on npm"
          else
            npm publish "$tarball" --access public --provenance
          fi
