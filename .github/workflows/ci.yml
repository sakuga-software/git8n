name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `release-npm.yml` runs the same checks on the commit of a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # A private repository runs on our self-hosted runners. A public repository
    # or a fork runs on GitHub-hosted runners: a pull request from a fork must
    # never run on our machines, and the runner group refuses public repositories.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","sakuga-linux-arm"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}

      # A self-hosted runner keeps its work directory between jobs. A full clean
      # deletes node_modules, and `pnpm install` creates all its links again:
      # 1.3 to 2.1 GB of disk writes for each job. This step keeps node_modules.
      - name: Clean the work directory
        if: runner.environment == 'self-hosted'
        run: git clean -ffdx -e node_modules

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # A self-hosted runner keeps its pnpm store on disk. There, the cache only
      # extracts the same store again.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile

      # The root lockfile pins oxlint and oxfmt. A newer version can add a rule
      # that fails the job on code that nobody touched.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

  checks:
    # The same rule as `lint`.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","sakuga-linux"]') || 'ubuntu-latest' }}
    steps:
      # `pnpm install` runs the lifecycle scripts of the pull request. The
      # checkout keeps no token, so these scripts get none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}

      # The same reason as in `lint`.
      - name: Clean the work directory
        if: runner.environment == 'self-hosted'
        run: git clean -ffdx -e node_modules

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  changeset:
    # A pull request that changes the npm package carries a changeset (DB-688).
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","sakuga-linux-arm"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
          # The merge commit and its first parent, the head of the base.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: The guard is right
        run: node --test 'tools/ci/*.test.ts'

      - name: A change to the npm package carries a changeset
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/ci/changeset.ts "$EVENT"
